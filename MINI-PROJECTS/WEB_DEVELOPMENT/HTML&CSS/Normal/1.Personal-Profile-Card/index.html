<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="Styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <img
          class="logo-photo"
          src="Logo&Profile/image.png"
          alt="Company Logo"
        />
      </header>

      <section class="values">
        <div class="value">Diligent</div>
        <div class="value">Passionate</div>
        <div class="value">Creative</div>
        <div class="value">Team Player</div>
      </section>

      <main class="content">
        <div class="profile-section">
          <img
            class="img-profile"
            src="Logo&Profile/Profile.png"
            alt="Brian Maruga's Profile Picture"
          />
          <h1 class="name">Brian Maruga</h1>
          <p class="role">Software/AI Machine Learning Engineer</p>
        </div>
        <div class="details">
          <p class="id">ID NO: 40617021</p>
          <p class="dob">DOB: 26/09/2003</p>
          <p class="email">Email: brianmaruga78@gmail.com</p>
          <p class="phone">Phone: +254 790 473 359</p>
        </div>
      </main>
    </div>
  </body>
</html>
