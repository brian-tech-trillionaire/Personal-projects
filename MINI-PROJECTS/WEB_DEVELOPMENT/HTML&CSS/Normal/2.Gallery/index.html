<!doctype html>
<html lang="en">
  <head>
    <title>Brian's Gallery</title>
    <link rel="stylesheet" href="Style.css" />
  </head>

  <body>
    <div class="header">
      <h1>Brian's Gallery</h1>
      <p>A collection of beautiful moments</p>
    </div>
    <div class="container">
      <div class="image">
        <img src="Images/1.jpeg" alt="Gallery image 1" data-caption="Image 1" />
      </div>
      <div class="image">
        <img src="Images/2.jpeg" alt="Gallery image 2" data-caption="Image 2" />
      </div>
      <div class="image">
        <img src="Images/3.jpeg" alt="Gallery image 3" data-caption="Image 3" />
      </div>
      <div class="image">
        <img src="Images/4.jpeg" alt="Gallery image 4" data-caption="Image 4" />
      </div>
      <div class="image">
        <img src="Images/5.jpeg" alt="Gallery image 5" data-caption="Image 5" />
      </div>
      <div class="image">
        <img src="Images/6.jpeg" alt="Gallery image 6" data-caption="Image 6" />
      </div>
      <div class="image">
        <img src="Images/7.jpeg" alt="Gallery image 7" data-caption="Image 7" />
      </div>
      <div class="image">
        <img src="Images/8.jpeg" alt="Gallery image 8" data-caption="Image 8" />
      </div>
      <div class="image">
        <img src="Images/9.jpeg" alt="Gallery image 9" data-caption="Image 9" />
      </div>
      <div class="image">
        <img
          src="Images/10.jpeg"
          alt="Gallery image 10"
          data-caption="Image 10"
        />
      </div>
      <div class="image">
        <img
          src="Images/11.jpeg"
          alt="Gallery image 11"
          data-caption="Image 11"
        />
      </div>
      <div class="image">
        <img
          src="Images/12.jpeg"
          alt="Gallery image 12"
          data-caption="Image 12"
        />
      </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
      <span class="close">&times;</span>
      <img class="lightbox-content" id="lightbox-img" />
      <div id="caption"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
